[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-scout"
version = "0.1.0"
description = "Local-first evidence-grounded scientific knowledge and discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
scout = "research_scout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"research_scout.resources" = ["*.md", "*.json"]
